name: Playwright Tests + Allure Report

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# ── Permissions required for GitHub Pages deployment ──────────────────────────
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to Pages
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — Run tests and generate Allure HTML report
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers (with system deps)
        run: npx playwright install --with-deps chromium

      # ── Run tests ──────────────────────────────────────────────────────────
      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true   # always proceed to report generation even on failure

      # ── Generate Allure report (requires Java) ─────────────────────────────
      - name: Setup Java 17 (required by Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI globally
        run: npm install -g allure-commandline

      - name: Generate Allure HTML report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      # ── Upload artifacts ───────────────────────────────────────────────────
      - name: Upload Allure raw results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # ── Prepare for GitHub Pages (upload as pages artifact) ────────────────
      - name: Upload Allure report to GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: allure-report/

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Deploy Allure report to GitHub Pages
  # Only runs on push to main/master (not on PRs)
  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy Allure Report to GitHub Pages
    needs: test
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
